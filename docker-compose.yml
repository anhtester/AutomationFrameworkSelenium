# Selenium Grid for remote execution (TARGET=remote).
#
# Start:   docker compose up -d
# Run:     mvn test -DTARGET=remote -DREMOTE_URL=localhost -DREMOTE_PORT=4444 -DBROWSER=chrome
# Console: http://localhost:4444/ui
# Stop:    docker compose down
#
# Image version matches selenium-java in pom.xml (selenium.version). Scale nodes: docker compose up -d --scale chrome=3

services:
  selenium-hub:
    image: selenium/hub:4.53.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    healthcheck:
      test: [ "CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444" ]
      interval: 10s
      timeout: 5s
      retries: 10

  chrome:
    image: selenium/node-chrome:4.53.0
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=300
      # DevTools (video screencast) and BiDi URLs point to the hub, reachable from the test machine
      - SE_NODE_GRID_URL=http://localhost:4444

  edge:
    image: selenium/node-edge:4.53.0
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=300
      # DevTools (video screencast) and BiDi URLs point to the hub, reachable from the test machine
      - SE_NODE_GRID_URL=http://localhost:4444

  firefox:
    image: selenium/node-firefox:4.53.0
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=300
      # DevTools (video screencast) and BiDi URLs point to the hub, reachable from the test machine
      - SE_NODE_GRID_URL=http://localhost:4444
