# Build and run the Selenium tests with Maven on GitHub Actions.
# - Runs the suites on several browsers (matrix), each browser uploads its own reports/logs.
# - Reports are published to GitHub Pages only from a push on main (chrome run), never from pull requests.
# - The job is RED when a test or a configuration method (@BeforeMethod...) failed.

name: Run Maven with GitHub CI

on:
   push:
      branches: [ "main" ]
   pull_request:
      branches: [ "main" ]
   workflow_dispatch:
      inputs:
         groups:
            description: 'TestNG groups to run (ex: smoke). Empty = all'
            required: false
            default: ''
         env:
            description: 'Environment file config/env/<env>.properties (ex: demo). Empty = default config'
            required: false
            default: ''

permissions:
   contents: write # needed to publish reports to the gh-pages branch

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   # Cancel outdated runs of a pull request, but never cancel a run of main while it publishes reports
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
   build:
      name: Test on ${{ matrix.browser }}
      runs-on: ${{ matrix.os }}
      timeout-minutes: 60

      strategy:
         fail-fast: false
         # Chrome, Edge, Firefox, Safari and the Grid job run at the same time. Tests of the group "single-run" change data shared
         # by all runs (cart and orders of the demo account): they run only in the Chrome job.
         # Safari (WebKit) exists only on macOS, has no headless mode and one automation session at a time.
         matrix:
            include:
               -  browser: chrome
                  os: windows-latest
                  target: local
                  headless: 'true'
                  threads: ''
                  excluded-groups: ''
               -  browser: edge
                  os: windows-latest
                  target: local
                  headless: 'true'
                  threads: ''
                  excluded-groups: single-run
               -  browser: firefox
                  os: windows-latest
                  target: local
                  headless: 'true'
                  threads: ''
                  excluded-groups: single-run
               # Safari through a Selenium Grid started on the macOS runner (Safari can not run in Docker)
               -  browser: safari
                  os: macos-latest
                  target: remote
                  headless: 'false'
                  threads: '1'
                  excluded-groups: single-run

      env:
         GROUPS: ${{ github.event.inputs.groups }}
         ENV: ${{ github.event.inputs.env }}
         PUBLISH_REPORTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.browser == 'chrome' }}

      steps:
         -  uses: actions/checkout@v4
            with:
               submodules: recursive
               fetch-depth: 0

         -  name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
               distribution: 'corretto'
               java-version: '21'
               cache: maven

         -  name: Enable Safari WebDriver
            if: matrix.browser == 'safari'
            run: sudo safaridriver --enable

         -  name: Start Selenium Grid on macOS (Safari node)
            if: matrix.target == 'remote'
            shell: bash
            run: |
               version=$(grep -m1 -o '<selenium.version>[^<]*' pom.xml | cut -d'>' -f2)
               echo "Selenium Grid $version"
               curl -sfL -o selenium-server.jar "https://github.com/SeleniumHQ/selenium/releases/download/selenium-${version}/selenium-server-${version}.jar"
               mkdir -p exports/logs
               nohup java -jar selenium-server.jar standalone --port 4444 > exports/logs/selenium-grid.log 2>&1 &
               for i in $(seq 1 60); do
                  if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
                     echo "Selenium Grid is ready"; curl -s http://localhost:4444/status | head -c 600; exit 0
                  fi
                  sleep 2
               done
               cat exports/logs/selenium-grid.log
               exit 1

         -  name: Run test with Maven (${{ matrix.browser }})
            run: mvn clean test --file pom.xml -DBROWSER=${{ matrix.browser }} -DTARGET=${{ matrix.target }} -DREMOTE_URL=localhost -DREMOTE_PORT=4444 -DHEADLESS=${{ matrix.headless }} -DVIDEO_RECORD=failed "-DEXCLUDED_GROUPS=${{ matrix.excluded-groups }}" "-DTHREAD_COUNT=${{ matrix.threads }}"

         -  name: Get Allure history
            uses: actions/checkout@v4
            if: always() && env.PUBLISH_REPORTS == 'true'
            continue-on-error: true
            with:
               ref: gh-pages
               path: gh-pages

         -  name: Copy Allure history
            if: always() && env.PUBLISH_REPORTS == 'true'
            continue-on-error: true
            shell: bash
            run: |
               mkdir -p target/allure-results/history
               cp -Rr gh-pages/history/* target/allure-results/history/ || true

         -  name: Generate Allure Report
            if: always()
            run: mvn allure:report --file pom.xml

         -  name: Upload Extent Report
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: extent-report-${{ matrix.browser }}
               path: exports/ExtentReports/ExtentReports.html
               if-no-files-found: ignore

         -  name: Upload Allure Report
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: allure-report-${{ matrix.browser }}
               path: target/site/allure-maven-plugin/
               if-no-files-found: ignore

         -  name: Upload videos for tests
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: test-videos-${{ matrix.browser }}
               path: exports/ExportData/Videos
               if-no-files-found: ignore

         -  name: Upload screenshots for tests
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: test-screenshots-${{ matrix.browser }}
               path: exports/ExportData/Images
               if-no-files-found: ignore

         -  name: Upload logs (applog, error.log, one log file per test)
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: test-logs-${{ matrix.browser }}
               path: exports/logs
               if-no-files-found: ignore

         -  name: Deploy Allure Report to GitHub Pages
            if: always() && env.PUBLISH_REPORTS == 'true'
            uses: peaceiris/actions-gh-pages@v4
            with:
               github_token: ${{ secrets.GITHUB_TOKEN }}
               publish_branch: gh-pages
               publish_dir: target/site/allure-maven-plugin

         -  name: Generate JavaDocs
            if: always() && env.PUBLISH_REPORTS == 'true'
            run: mvn javadoc:javadoc

         -  name: Deploy JavaDoc to GitHub Pages
            if: always() && env.PUBLISH_REPORTS == 'true'
            uses: peaceiris/actions-gh-pages@v4
            with:
               github_token: ${{ secrets.GITHUB_TOKEN }}
               publish_branch: gh-pages
               publish_dir: docs
               destination_dir: docs
               keep_files: true

         # maven.test.failure.ignore=true lets the reports be generated and published even when tests fail.
         # This last step makes the job RED when at least one test failed (retried attempts are not counted).
         -  name: Fail the job if any test failed
            if: always()
            shell: bash
            run: |
               f=target/surefire-reports/testng-results.xml
               if [ ! -f "$f" ]; then
                  echo "::error::TestNG results not found ($f): tests did not run"
                  exit 1
               fi
               header=$(grep -o '<testng-results[^>]*>' "$f" | head -1)
               echo "TestNG results: $header"
               # Count failed tests AND failed configuration methods (@BeforeMethod... => tests are only "skipped")
               failed=$(grep -c 'status="FAIL"' "$f" || true)
               passed=$(echo "$header" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
               if [ "${failed:-0}" -gt 0 ]; then
                  echo "::error::${failed} test/configuration method(s) failed on ${{ matrix.browser }}"
                  exit 1
               fi
               if [ "${passed:-0}" -eq 0 ]; then
                  echo "::error::No test passed on ${{ matrix.browser }}"
                  exit 1
               fi

   # Same regression on Selenium Grid in Docker (remote execution, Linux browsers, video of failed tests).
   # Runs at the same time as the "build" job, without the "single-run" tests (shared cart/orders of the demo account).
   grid:
      name: Test on Selenium Grid (Docker, chrome)
      runs-on: ubuntu-latest
      timeout-minutes: 45

      env:
         GROUPS: ${{ github.event.inputs.groups }}
         ENV: ${{ github.event.inputs.env }}

      steps:
         -  uses: actions/checkout@v4
            with:
               submodules: recursive

         -  name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
               distribution: 'corretto'
               java-version: '21'
               cache: maven

         -  name: Start Selenium Grid (hub + chrome node)
            run: docker compose up -d selenium-hub chrome

         -  name: Wait until the Grid is ready
            run: |
               for i in $(seq 1 60); do
                  if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
                     echo "Selenium Grid is ready"; exit 0
                  fi
                  sleep 2
               done
               docker compose logs
               exit 1

         -  name: Run test on the Grid
            run: >-
               mvn clean test -B
               -DTARGET=remote -DREMOTE_URL=localhost -DREMOTE_PORT=4444
               -DBROWSER=chrome -DHEADLESS=true -DVIDEO_RECORD=failed -DEXCLUDED_GROUPS=single-run

         -  name: Upload logs, videos and Allure results (Grid)
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: grid-results
               path: |
                  exports/logs
                  exports/ExportData/Videos
                  target/allure-results
               if-no-files-found: ignore

         -  name: Grid logs
            if: failure()
            run: docker compose logs --tail=200

         -  name: Stop Selenium Grid
            if: always()
            run: docker compose down

         -  name: Fail the job if any test failed
            if: always()
            shell: bash
            run: |
               f=target/surefire-reports/testng-results.xml
               if [ ! -f "$f" ]; then
                  echo "::error::TestNG results not found ($f): tests did not run"
                  exit 1
               fi
               header=$(grep -o '<testng-results[^>]*>' "$f" | head -1)
               echo "TestNG results: $header"
               failed=$(grep -c 'status="FAIL"' "$f" || true)
               passed=$(echo "$header" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
               if [ "${failed:-0}" -gt 0 ]; then
                  echo "::error::${failed} test/configuration method(s) failed on Selenium Grid"
                  exit 1
               fi
               if [ "${passed:-0}" -eq 0 ]; then
                  echo "::error::No test passed on Selenium Grid"
                  exit 1
               fi
