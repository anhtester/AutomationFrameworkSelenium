#
# Environment "demo": mvn test -DENV=demo
#
# How it works:
# - config.properties and data.properties are loaded first (common configuration)
# - then config/env/<ENV>.properties: its keys override the common ones
# - then -Dkey=value / environment variables override everything
#
# Add your environments next to this file, ex: dev.properties, staging.properties,
# with only the keys that change (URLs, accounts, timeouts...). Never commit real passwords:
# give them with -D or CI secrets (environment variables).
#
URL_CMS_ADMIN = https://cms.anhtester.com/login
URL_CMS_USER = https://cms.anhtester.com
